version: 1

reviewers:
  sonnet:
    protocol: claude-structured
    agent_profile: autoreview-sonnet
    label: Sonnet
    finding_prefix: S
  codex:
    protocol: codex-envelope
    agent_profile: autoreview-codex
    label: Codex
    finding_prefix: X

pipelines:
  core:
    reviewers: [sonnet]
    incremental_reviewers: [sonnet]
    prompt: prompts/generic.md
    checkout: base
    project_sources: [manual]
  untrusted:
    # Base checkout: the reviewer never works in code from the pull request.
    reviewers: [codex]
    incremental_reviewers: [codex]
    prompt: prompts/generic.md
    checkout: base
    project_sources: [manual]

repositories:
  - match: zajca/pohunek
    trigger: label:ai:review
    pipeline: core
    on_findings: request_changes
    on_clean: comment
    authors:
      trusted:
        permission: write
      untrusted: skip
  - match: pohunekd/*
    trigger: label:ai:review
    pipeline: core
    on_findings: request_changes
    on_clean: comment
    authors:
      # Forks are untrusted unless their author is listed in logins.
      trusted:
        permission: maintain
      untrusted:
        pipeline: untrusted
        on_findings: comment
        on_clean: comment

unmatched: skip

approval:
  timeout_hours: 168

notifications:
  approval_requested: action
  handoff_reminder: action
  findings_on_own_pr: action
  credential_invalid: action
  credential_expiring: action
  review_stopped: action
  cleanup_manual: action
  command_failed: action
  approved: digest
  changes_requested: digest
  commented: digest
  approval_expired: digest
  started: log
  retry_scheduled: log
  superseded: log
