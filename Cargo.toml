[workspace]
resolver = "3"
members = [
    "crates/go-compat",
    "crates/policy",
    "crates/schedule",
    "crates/engine",
    "crates/external",
    "crates/autoreview",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"
repository = "https://github.com/pohunekd/autoreview"

[workspace.dependencies]
tokio = "1.52.3"
tokio-util = "0.7.18"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde-saphyr = "2.0.0"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rustix = { version = "1.1.5", features = ["fs"] }
clap = { version = "4.6.1", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "json", "std"] }
thiserror = "2.0.18"
time = { version = "0.3.49", features = ["parsing", "formatting"] }
sha2 = "0.10.9"
hex = "0.4.3"
regex = "1.12.4"
base64 = "0.22.1"
getrandom = "0.3.4"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
disallowed_types = "deny"
