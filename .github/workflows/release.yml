name: Release

# A pushed tag v<version> builds the static musl archives and the linux/amd64
# image, pushes the image to GHCR, attests both and creates a draft release; the
# owner reviews and publishes the draft. A manual run is a dry run: it builds
# the archives of the selected ref and uploads them as workflow artifacts,
# builds and checks the image, and pushes, attests and publishes nothing. The workflow never
# creates, moves or deletes a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One run per ref. A release run is never cancelled half way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Reads the version and, for a tag, refuses one that is not v<workspace
  # version>. A tag push also renders the release notes from CHANGELOG.md, so a
  # tag without a folded changelog section fails before anything is built.
  meta:
    name: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The event decides, not the ref type: a manual run on a tag is a dry run.
      - name: Version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            version="$(scripts/release-version "$TAG")"
          else
            version="$(scripts/release-version)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Toolchain
        if: github.event_name == 'push'
        run: rustup show active-toolchain
      - name: Release notes
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          scripts/changelog notes "$VERSION" > "$RUNNER_TEMP/release-notes.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push'
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  # One native runner per target. rustup reads rust-toolchain.toml, so the
  # release uses the channel of the gates. No cache is restored: a release
  # binary is built only from this commit and the locked crates.
  build:
    name: build ${{ matrix.target }}
    needs: meta
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.meta.outputs.version }}
      # musl-gcc compiles the C code of the bundled SQLite and of ring. cc-rs
      # finds it by itself only for x86_64, so it is named for every target.
      TARGET_CC: musl-gcc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the musl C compiler
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends musl-tools
      - name: Toolchain
        run: |
          set -euo pipefail
          cargo --version
          rustup target add "$TARGET"
      - name: Build
        run: cargo build --release --locked --target "$TARGET" -p autoreview --bin autoreview
      # A static binary has no NEEDED entry. The version text must name the
      # version of the tag.
      - name: Check the binary
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/autoreview"
          if readelf -d "$bin" | grep -q '(NEEDED)'; then
            readelf -d "$bin"
            echo "::error::$bin is not statically linked"
            exit 1
          fi
          test "$("$bin" --version)" = "autoreview $VERSION"
      - name: Package
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          scripts/release-archive "$VERSION" "$TARGET" "target/$TARGET/release/autoreview" dist
          cd dist
          sha256sum -c -- "autoreview-$VERSION-$TARGET.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archive-${{ matrix.target }}
          path: |
            dist/autoreview-${{ needs.meta.outputs.version }}-${{ matrix.target }}.tar.gz
            dist/autoreview-${{ needs.meta.outputs.version }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  # Builds the linux/amd64 image from the x86_64 archive of this run and checks
  # that `init` and `validate` run in it. It has no write permission; on a tag
  # push, image-push pushes the saved image.
  image:
    name: image
    needs: [meta, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      ARCHIVE: autoreview-${{ needs.meta.outputs.version }}-x86_64-unknown-linux-musl
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: archive-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/dist
      - name: Unpack the archive
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dist"
          sha256sum -c -- "$ARCHIVE.tar.gz.sha256"
          mkdir "$RUNNER_TEMP/context"
          tar -xzf "$ARCHIVE.tar.gz" -C "$RUNNER_TEMP/context"
      - name: Build
        run: |
          set -euo pipefail
          docker build -f deploy/image/Dockerfile --build-arg "VERSION=$VERSION" \
            --tag "autoreview:$VERSION" "$RUNNER_TEMP/context"
      # The example configuration, written by init in the image, must pass
      # validate in a read-only container without network; the token values
      # are placeholders, which validate never sends.
      - name: Validate the example configuration
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/config"
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP/config:/etc/autoreview" "autoreview:$VERSION" \
            init --dir /etc/autoreview --login review-bot --pohunek-host review-host \
            --example single-repo-comment
          docker run --rm --network none --read-only \
            -v "$RUNNER_TEMP/config:/etc/autoreview:ro" \
            -e AUTOREVIEW_GH_TOKEN=placeholder -e AUTOREVIEW_MATRIX_TOKEN=placeholder \
            "autoreview:$VERSION" validate
      - name: Save
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/image"
          docker save -o "$RUNNER_TEMP/image/image.tar" "autoreview:$VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push'
        with:
          name: image
          path: ${{ runner.temp }}/image/image.tar
          if-no-files-found: error

  # The only job with `packages: write`. It runs no repository code: it pushes
  # the image that `image` checked as ghcr.io/<repository>:<version>, refuses a
  # tag that exists, and outputs the digest of the pushed manifest.
  image-push:
    name: image-push
    needs: [meta, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image
          path: ${{ runner.temp }}/image
      - name: Push
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION exists; delete that package version and run again"
            exit 1
          fi
          docker load -i "$RUNNER_TEMP/image/image.tar"
          docker tag "autoreview:$VERSION" "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION"
          # The digest that the registry serves for the tag is what a pull resolves.
          digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE:$VERSION")"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no digest for the pushed image: $digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker logout ghcr.io

  # Attests the pushed image by digest. Like attest, it runs no repository code.
  attest-image:
    name: attest-image
    needs: image-push
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ needs.image-push.outputs.digest }}

  # With attest-image, the only jobs that can mint an OIDC token. It runs no
  # repository code and no build script; it signs exactly the files the build
  # jobs uploaded.
  attest:
    name: attest
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: archive-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: Check the checksums
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dist"
          sha256sum -c -- *.sha256
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/dist/*.sha256

  # The only job with `contents: write`. It runs no repository code. It creates
  # a draft for the existing tag (`--verify-tag` never creates one) and removes
  # only a draft that this run created, when a later step fails or the run is
  # cancelled.
  release:
    name: release
    needs: [meta, attest, attest-image]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      # The commit that meta checked out; the build jobs check out the same ref.
      COMMIT: ${{ needs.meta.outputs.commit }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: archive-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes
      - name: Check the checksums
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dist"
          sha256sum -c -- *.sha256
      # The releases list includes drafts. A leftover draft of this tag blocks
      # the run: delete it, then run the workflow again.
      - name: Refuse a moved tag or an existing release
        run: |
          set -euo pipefail
          tagged="$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)"
          if [ "$tagged" != "$COMMIT" ]; then
            echo "::error::$TAG points to $tagged, this run built $COMMIT"
            exit 1
          fi
          existing="$(gh api --paginate "repos/$GH_REPO/releases" \
            --jq '.[] | select(.tag_name == env.TAG) | .id')"
          if [ -n "$existing" ]; then
            echo "::error::a release or draft for $TAG exists; delete it and run again"
            exit 1
          fi
      - name: Create the draft release
        id: draft
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dist"
          gh release create "$TAG" --draft --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes/release-notes.md" ./*
      - name: Check the draft assets
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dist"
          want="$(for file in *; do
            printf '%s sha256:%s\n' "$file" "$(sha256sum -- "$file" | cut -d' ' -f1)"
          done | LC_ALL=C sort)"
          have="$(gh api --paginate "repos/$GH_REPO/releases" \
            --jq '.[] | select(.tag_name == env.TAG and .draft) | .assets[]
              | select(.state == "uploaded") | "\(.name) \(.digest)"' | LC_ALL=C sort)"
          if [ "$want" != "$have" ]; then
            printf 'expected:\n%s\nfound:\n%s\n' "$want" "$have"
            echo "::error::the draft assets differ from the built archives"
            exit 1
          fi
      # failure() is false on a cancelled run or a job timeout, so cancelled() is
      # needed too. A skipped draft step means an earlier step stopped the job and
      # any existing draft is not this run's.
      - name: Remove the incomplete draft
        if: (failure() || cancelled()) && steps.draft.outcome != 'skipped'
        run: |
          set -euo pipefail
          for id in $(gh api --paginate "repos/$GH_REPO/releases" \
            --jq '.[] | select(.tag_name == env.TAG and .draft) | .id'); do
            gh api -X DELETE "repos/$GH_REPO/releases/$id"
          done
