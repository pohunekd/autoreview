name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR cancels its older run; main runs are never
# cancelled so every merge commit gets a result. A label change re-runs the
# same head and must not cancel the run that is still producing its results.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.action != 'unlabeled' }}

permissions:
  contents: read

jobs:
  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The docs checker needs PyYAML. A virtualenv keeps the pinned version
      # out of the system Python, which Ubuntu's PEP 668 policy protects.
      - name: Install the docs checker
        run: |
          python3 -m venv "$RUNNER_TEMP/docs-venv"
          "$RUNNER_TEMP/docs-venv/bin/pip" install --disable-pip-version-check pyyaml==6.0.3
      - name: Documentation gates
        run: PATH="$RUNNER_TEMP/docs-venv/bin:$PATH" scripts/gates docs

  # Runs the test suite of every adapter under adapters/. The suites use the
  # Python standard library only.
  adapters:
    name: adapters
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Adapter gates
        run: scripts/gates adapters

  # Runs the Rust gates with the toolchain pinned in rust-toolchain.toml, which
  # rustup on the runner installs on the first cargo call.
  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: short
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # PRs restore main's cache and never overwrite it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust gates
        run: scripts/gates rust

  # Checks the licences and advisories of Cargo.lock against deny.toml. The
  # advisory database is fetched on every run, so a new advisory fails every
  # pull request until it is fixed or ignored in deny.toml.
  deny:
    name: deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: always
      CARGO_DENY_VERSION: 0.20.2
      # SHA-256 of the release archive, taken once from the release page.
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain
      - name: Install cargo-deny
        run: |
          set -euo pipefail
          name="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl"
          base="https://github.com/EmbarkStudios/cargo-deny/releases/download"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/$name.tar.gz" \
            "$base/$CARGO_DENY_VERSION/$name.tar.gz"
          echo "$CARGO_DENY_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - name: Dependency gates
        run: scripts/gates deny

  # Validates every changelog fragment and, on a pull request, requires one unless
  # the pull request carries `no-changelog`. Needs the full history for the base.
  changelog:
    name: changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # PRs restore main's cache and never overwrite it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Validate the fragments
        run: scripts/changelog check
      - name: Require a fragment
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NO_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        run: |
          set -euo pipefail
          if [ "$NO_CHANGELOG" = "true" ]; then
            echo "Labelled no-changelog: no fragment required."
            exit 0
          fi
          # Only names that the contract accepts as fragments count; a hidden or misnamed file does not.
          added="$(git diff --name-only --diff-filter=AM "$BASE_SHA" HEAD -- 'changelog.d/*.md' \
            | grep -E '^changelog\.d/[1-9][0-9]*-[a-z0-9]+(-[a-z0-9]+)*\.md$' || true)"
          if [ -z "$added" ]; then
            echo "::error::add a changelog fragment under changelog.d/ or label the pull request no-changelog"
            exit 1
          fi
          echo "$added"

  # The only required status check. A job that did not succeed fails it, so a
  # skipped or cancelled job cannot pass the merge gate by accident.
  ci:
    name: ci
    needs: [docs, adapters, rust, deny, changelog]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job ended with '$r'"
              exit 1
            fi
          done
